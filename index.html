<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Blindfold Brush</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app">
      <section id="mainMenu" class="main-menu" aria-labelledby="mainTitle">
        <div>
          <h1 id="mainTitle">Blindfold Brush</h1>
          <p>Create a room or join your friends with a four-letter code.</p>
        </div>
        <div class="controls" role="toolbar" aria-label="Drawing tools">
          <div class="paint-supplies">
            <div class="color-palette" aria-label="Brush colors">
              <button class="color-swatch is-active" type="button" data-color="#1f2937" style="--swatch: #1f2937;" aria-label="Charcoal"></button>
              <button class="color-swatch" type="button" data-color="#ef4444" style="--swatch: #ef4444;" aria-label="Red"></button>
              <button class="color-swatch" type="button" data-color="#f97316" style="--swatch: #f97316;" aria-label="Orange"></button>
              <button class="color-swatch" type="button" data-color="#facc15" style="--swatch: #facc15;" aria-label="Yellow"></button>
              <button class="color-swatch" type="button" data-color="#22c55e" style="--swatch: #22c55e;" aria-label="Green"></button>
              <button class="color-swatch" type="button" data-color="#14b8a6" style="--swatch: #14b8a6;" aria-label="Teal"></button>
              <button class="color-swatch" type="button" data-color="#3b82f6" style="--swatch: #3b82f6;" aria-label="Blue"></button>
              <button class="color-swatch" type="button" data-color="#8b5cf6" style="--swatch: #8b5cf6;" aria-label="Violet"></button>
              <button class="color-swatch" type="button" data-color="#ec4899" style="--swatch: #ec4899;" aria-label="Pink"></button>
              <button class="color-swatch" type="button" data-color="#ffffff" style="--swatch: #ffffff;" aria-label="White"></button>
            </div>

            <div class="tool-group" aria-label="Tools">
              <button class="tool-button is-active" type="button" data-tool="pen" aria-label="Pen" aria-pressed="true">
                <img src="pen-icon.svg" alt="" draggable="false">
              </button>
              <button class="tool-button" type="button" data-tool="eraser" aria-label="Eraser" aria-pressed="false">
                <img src="eraser-icon.svg" alt="" draggable="false">
              </button>
            </div>
          </div>

        <div class="room-controls">
          <label for="nicknameInput">Nickname</label>
          <input id="nicknameInput" type="text" maxlength="18" value="Player" autocomplete="nickname">

          <button id="undoCanvas" type="button">Undo</button>
          <button id="clearCanvas" type="button">Clear</button>
        </div>

        <button id="leaveRoomButton" type="button">Leave Room</button>
      </section>

      <div class="canvas-stage">
        <canvas id="drawingCanvas" width="900" height="560" aria-label="Drawing canvas"></canvas>
      </div>
    </main>

    <script src="rooms.js"></script>
    <script>
      const roomApi = window.BlindfoldBrushRooms;
      const mainMenu = document.querySelector("#mainMenu");
      const roomLobby = document.querySelector("#roomLobby");
      const gameArea = document.querySelector("#gameArea");
      const nicknameInput = document.querySelector("#nicknameInput");
      const roomCodeInput = document.querySelector("#roomCodeInput");
      const createRoomButton = document.querySelector("#createRoomButton");
      const joinRoomButton = document.querySelector("#joinRoomButton");
      const leaveRoomButton = document.querySelector("#leaveRoomButton");
      const roomMessage = document.querySelector("#roomMessage");
      const roomCodeTitle = document.querySelector("#roomCodeTitle");
      const roomStatus = document.querySelector("#roomStatus");
      const playerList = document.querySelector("#playerList");
      const currentRoomKey = "blindfold-brush-current-room";
      const currentPlayerKey = "blindfold-brush-current-player";

      let roomManager = null;
      let currentPlayer = null;

      function showRoomMessage(message) {
        roomMessage.textContent = message;
      }

      function createLocalPlayer() {
        const savedPlayer = window.localStorage.getItem(currentPlayerKey);

        if (savedPlayer) {
          return JSON.parse(savedPlayer);
        }

        return {
          id: roomApi.createPlayerId(),
          nickname: "Player",
        };
      }

      function getCurrentPlayer() {
        currentPlayer.nickname = nicknameInput.value.trim() || "Player";
        window.localStorage.setItem(currentPlayerKey, JSON.stringify(currentPlayer));
        return currentPlayer;
      }

      function renderRoom(room) {
        mainMenu.hidden = true;
        roomLobby.hidden = false;
        gameArea.hidden = false;
        roomCodeTitle.textContent = room.code;
        roomStatus.textContent = room.hostId === currentPlayer.id
          ? "Share this four-letter code so people can connect."
          : "You joined the room.";
        playerList.innerHTML = "";

        room.players
          .filter((player) => player.isActive)
          .forEach((player) => {
            const playerItem = document.createElement("li");
            playerItem.textContent = `${player.nickname}${player.id === room.hostId ? " (Host)" : ""}`;
            playerList.append(playerItem);
          });
      }

      function leaveCurrentRoom() {
        const roomCode = window.localStorage.getItem(currentRoomKey);

        if (roomCode) {
          roomManager.leave(roomCode, currentPlayer.id);
        }

        window.localStorage.removeItem(currentRoomKey);
        roomLobby.hidden = true;
        gameArea.hidden = true;
        mainMenu.hidden = false;
      }

      if (!roomApi) {
        showRoomMessage("Room code helpers are not loaded yet.");
      } else {
        roomManager = new roomApi.BlindfoldBrushRoomManager();
        currentPlayer = createLocalPlayer();
        nicknameInput.value = currentPlayer.nickname;

        roomCodeInput.addEventListener("input", () => {
          roomCodeInput.value = roomApi.normalizeRoomCode(roomCodeInput.value);
        });

        createRoomButton.addEventListener("click", () => {
          const room = roomManager.create(getCurrentPlayer());
          window.localStorage.setItem(currentRoomKey, room.code);
          showRoomMessage("");
          renderRoom(room);
        });

        joinRoomButton.addEventListener("click", () => {
          const roomCode = roomApi.normalizeRoomCode(roomCodeInput.value);

          if (roomCode.length !== roomApi.ROOM_CODE_LENGTH) {
            showRoomMessage("Enter a four-letter room code.");
            return;
          }

          try {
            const room = roomManager.join(roomCode, getCurrentPlayer());
            window.localStorage.setItem(currentRoomKey, room.code);
            showRoomMessage("");
            renderRoom(room);
          } catch (error) {
            showRoomMessage("Room not found. Check the code and try again.");
          }
        });

        leaveRoomButton.addEventListener("click", leaveCurrentRoom);

        const savedRoomCode = window.localStorage.getItem(currentRoomKey);
        const savedRoom = savedRoomCode ? roomManager.get(savedRoomCode) : null;

        if (savedRoom && savedRoom.players.some((player) => player.id === currentPlayer.id && player.isActive)) {
          renderRoom(savedRoom);
        }
      }
    </script>

    <script src="drawing.js"></script>
  </body>
</html>
